[package]
name = "samba"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Samba — typed rate-limited consumer primitive for pleme-io. Provides UpstreamApi trait, LeakyBucket pacing, and JetStreamPullWorker that compose into rate-limited workers in ~30 LOC of binary code."
homepage = "https://github.com/pleme-io/samba"
repository = "https://github.com/pleme-io/samba"
license = "MIT"
categories = ["network-programming", "asynchronous"]
keywords = ["rate-limit", "throttle", "nats", "jetstream", "leaky-bucket"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
# `worker` (default) pulls the NATS JetStream drain + Prometheus/HTTP
# metrics server + YAML config loader. Disable it
# (`default-features = false`) to consume ONLY the NATS-free pacing core
# — `LeakyBucket` + `PressureLevel` + the light `Error`/`Result` — with
# zero async-nats / hyper / prometheus in the dependency closure. magma's
# apply engine is the canonical light-core consumer (a sequential
# in-process pacer, not a NATS worker).
default = ["worker"]
worker = [
  "dep:async-nats",
  "dep:async-trait",
  "dep:serde",
  "dep:serde_yaml_ng",
  "dep:tracing-subscriber",
  "dep:prometheus",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:bytes",
  "dep:futures",
]

[dependencies]
# ── Light core (always on): LeakyBucket pacing + typed errors ──
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
rand = "0.9"
# ── `worker`-only (NATS drain + metrics server + YAML config) ──
# ── ★ 0.38 CARRIED FOUR TLS ADVISORIES ────────────────────────────────
# It pinned rustls-webpki 0.102.8: three certificate-validation bypasses
# (name constraints wrongly accepted for URI names and for wildcard names;
# CRLs not treated as authoritative by distribution point) plus a
# reachable panic in CRL parsing. 0.50 is the first line that moves off
# it — 0.42 still pulls 0.102.8, which is why a smaller bump does not
# clear the audit.
#
# samba is a LIBRARY, so this pin was the one holding the vulnerable
# webpki in every consumer's lock. Fixing it here is the load-bearing fix;
# bumping only tend left samba's copy in the tree.
async-nats = { version = "0.50", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
# 0.13 pinned protobuf 2.28.0 (RUSTSEC: uncontrolled recursion crash,
# fixed >=3.7.2). 0.14 drops that chain entirely.
prometheus = { version = "0.14", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["server", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
assert_matches = "1"
pretty_assertions = "1"
proptest = "1"
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
